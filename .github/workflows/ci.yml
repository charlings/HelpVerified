name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:css
      - run: bun run typecheck
      - run: bun run test
      - name: Build
        shell: bash # -o pipefail, so a failed build still fails the step
        run: bun run build 2>&1 | tee build.log
      - name: Bundle budgets (docs/bundles.md)
        run: bun run bundle:check build.log
      - run: bunx playwright install --with-deps chromium webkit
      # The accessibility audit (every route x four widths) runs in its own job below.
      - run: bun run test:e2e --grep-invert "^audit "
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  a11y-audit:
    # M8: every route with seeded data — axe at 375/1280 px, no horizontal scroll at 375/768/1280/1536 px,
    # 44 px touch targets. Heaviest suite, so it has its own job (see docs/accessibility.md).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test e2e/audit.spec.ts --project=chromium
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-audit-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    # Measured on a GitHub runner because Lighthouse's 4x CPU throttle overstates load times on slow local machines.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: apps/web/lighthouse
          retention-days: 14

  api:
    # B1: lint, types, tests (including the migration round-trip) against a real PostgreSQL 16.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helpverified
          POSTGRES_PASSWORD: helpverified
          POSTGRES_DB: helpverified_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpverified"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      API_BASE_URL: http://localhost:8000
      WEB_BASE_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+asyncpg://helpverified:helpverified@localhost:5432/helpverified_test
      TEST_DATABASE_URL: postgresql+asyncpg://helpverified:helpverified@localhost:5432/helpverified_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets (tests use a fake Cloudinary; nothing is uploaded)
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "NIN_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CLOUDINARY_API_SECRET=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "CLOUDINARY_CLOUD_NAME=ci-unused" >> "$GITHUB_ENV"
          echo "CLOUDINARY_API_KEY=000000000000000" >> "$GITHUB_ENV"
          echo "PAYSTACK_SECRET_KEY=sk_test_$(openssl rand -hex 20)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - name: Migrations up, down to base, up (database.md §8)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest -q

  contracts:
    # B7: packages/contracts must match the API's OpenAPI schema. Building the app reads settings but
    # connects to nothing, so placeholder values are enough.
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      API_BASE_URL: http://localhost:8000
      WEB_BASE_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+asyncpg://unused:unused@localhost:5432/unused
      REDIS_URL: redis://localhost:6379/0
      CLOUDINARY_CLOUD_NAME: ci-unused
      CLOUDINARY_API_KEY: "000000000000000"
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets (nothing is called)
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "NIN_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CLOUDINARY_API_SECRET=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "PAYSTACK_SECRET_KEY=sk_test_$(openssl rand -hex 20)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: apps/api
      - run: bun run contracts:generate
      - name: Fail if the committed contracts are out of date
        run: git diff --exit-code -- packages/contracts || (echo "Run 'bun run contracts:generate' and commit the result." && exit 1)

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
