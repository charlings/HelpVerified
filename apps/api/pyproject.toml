[project]
name = "helpverified-api"
version = "0.1.0"
description = "HelpVerified API: verified domestic staff placements"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "time-machine>=3.5.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM", "PT"]
# Domain errors use the names in backend.md §5 (NotFound, Forbidden, Conflict), not an "Error" suffix.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Tests use fixed fake passwords and secrets on purpose.
"tests/**" = ["S101", "S105", "S106", "S107"]
# Migrations embed SQL exactly as in app/db/sql/; its lines aren't Python lines.
"app/db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = ["db: needs a running PostgreSQL (DATABASE_URL); skipped when it is unreachable"]
